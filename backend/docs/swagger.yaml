definitions:
  models.Admin:
    properties:
      _id:
        type: string
      created_at:
        type: string
      email:
        type: string
      password:
        type: string
      updated_at:
        type: string
      user_name:
        type: string
    required:
    - email
    - password
    - user_name
    type: object
  models.CreateUserRequest:
    properties:
      day:
        type: string
      dob:
        type: string
      email:
        type: string
      exam_id:
        type: string
      month:
        type: string
      name:
        type: string
      prometric_id:
        type: string
      prometric_password:
        type: string
    required:
    - day
    - dob
    - email
    - exam_id
    - month
    - name
    - prometric_id
    - prometric_password
    type: object
  models.Exam:
    properties:
      _id:
        type: string
      created_at:
        type: string
      exam_type:
        type: string
      section:
        type: string
      updated_at:
        type: string
    required:
    - exam_type
    type: object
  models.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  models.RequestAdmin:
    properties:
      email:
        type: string
      password:
        type: string
      user_name:
        type: string
    required:
    - email
    - password
    - user_name
    type: object
  models.User:
    properties:
      _id:
        type: string
      created_at:
        type: string
      day:
        type: string
      dob:
        type: string
      email:
        type: string
      exam_id:
        type: string
      month:
        type: string
      name:
        type: string
      prometric_id:
        type: string
      prometric_password:
        type: string
      status:
        type: string
      updated_at:
        type: string
    required:
    - day
    - dob
    - email
    - exam_id
    - month
    - name
    - prometric_id
    - prometric_password
    - status
    type: object
info:
  contact: {}
paths:
  /api/admins/{id}/get_admin:
    get:
      consumes:
      - application/json
      description: Get admin detail
      parameters:
      - description: Admin ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Admin'
      summary: Get admin
      tags:
      - Admins
  /api/admins/create_admin:
    post:
      consumes:
      - application/json
      description: Create a new admin in the system
      parameters:
      - description: Admin
        in: body
        name: admin
        required: true
        schema:
          $ref: '#/definitions/models.RequestAdmin'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Admin'
      summary: Create a new admin
      tags:
      - Admins
  /api/admins/forgot_password:
    post:
      consumes:
      - application/json
      description: Send mail to forgot password mail
      parameters:
      - description: Admin
        in: body
        name: admin
        required: true
        schema:
          $ref: '#/definitions/models.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Email sent successfully
          schema:
            type: string
      summary: AdminForgotPassword - Admin forgot password
      tags:
      - Admins
  /api/admins/get_all_admins:
    get:
      consumes:
      - application/json
      description: Get a list of admins
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Admin'
            type: array
      summary: Get all admins
      tags:
      - Admins
  /api/customers/{id}/delete_customer:
    delete:
      consumes:
      - application/json
      description: Delete a user
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User deleted successfully
          schema:
            type: string
      summary: Delete a user
      tags:
      - Users
  /api/customers/{id}/get_customer:
    get:
      consumes:
      - application/json
      description: Get user detail
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
      summary: Get user
      tags:
      - Users
  /api/customers/create_customer:
    post:
      consumes:
      - application/json
      description: Create a new user in the system
      parameters:
      - description: User
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.CreateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
      summary: Create a new user
      tags:
      - Users
  /api/customers/get_all_customers:
    get:
      consumes:
      - application/json
      description: Get a list of users
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.User'
            type: array
      summary: Get all users
      tags:
      - Users
  /api/exams/create_exams:
    post:
      consumes:
      - application/json
      description: Create exams
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Exam'
            type: array
      summary: Create exams
      tags:
      - Exams
  /api/exams/get_all_exams:
    get:
      consumes:
      - application/json
      description: Get a list of exams
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Exam'
            type: array
      summary: Get all exams
      tags:
      - Exams
swagger: "2.0"
