definitions:
  models.Exam:
    properties:
      _id:
        type: string
      created_at:
        type: string
      exam_type:
        type: string
      section:
        type: string
      updated_at:
        type: string
    required:
    - exam_type
    type: object
  models.RequestUser:
    properties:
      email:
        type: string
      jp_id:
        type: string
      jp_password:
        type: string
      name:
        type: string
      password:
        type: string
    required:
    - email
    - jp_id
    - jp_password
    - name
    - password
    type: object
  models.User:
    properties:
      _id:
        type: string
      created_at:
        description: Tempory_Date time.Time          `json:"tempory_date,omitempty"
          bson:"tempory_date,omitempty"`
        type: string
      email:
        type: string
      jp_id:
        type: string
      jp_password:
        type: string
      name:
        type: string
      password:
        type: string
      updated_at:
        type: string
    required:
    - email
    - jp_id
    - jp_password
    - name
    - password
    type: object
info:
  contact: {}
paths:
  /api/customers/{id}/delete_customer:
    delete:
      consumes:
      - application/json
      description: Delete a user
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User deleted successfully
          schema:
            type: string
      summary: Delete a user
      tags:
      - Users
  /api/customers/{id}/get_customer:
    get:
      consumes:
      - application/json
      description: Get user detail
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
      summary: Get user
      tags:
      - Users
  /api/customers/create_customer:
    post:
      consumes:
      - application/json
      description: Create a new user in the system
      parameters:
      - description: User
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.RequestUser'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
      summary: Create a new user
      tags:
      - Users
  /api/customers/get_all_customers:
    get:
      consumes:
      - application/json
      description: Get a list of users
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.User'
            type: array
      summary: Get all users
      tags:
      - Users
  /api/exams/create_exams:
    post:
      consumes:
      - application/json
      description: Create exams
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Exam'
            type: array
      summary: Create exams
      tags:
      - Exams
  /api/exams/get_all_exams:
    get:
      consumes:
      - application/json
      description: Get a list of exams
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Exam'
            type: array
      summary: Get all exams
      tags:
      - Exams
swagger: "2.0"
